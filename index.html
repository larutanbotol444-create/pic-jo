<style>
:root{--bg:#FFF3E0;--card:#fff;--ink:#2A1B3D;--muted:#6b5b80;--a:#FF4F81;--b:#FFC21A;--c:#1FBF83;--d:#6C4DFF;--fd:'Lilita One','Arial Rounded MT Bold','Trebuchet MS',sans-serif;--fb:'Nunito','Segoe UI',system-ui,sans-serif;

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#241636;--card:#33204A;--ink:#FFF3E0;--muted:#b9a8d0}}
:root[data-theme="dark"]{--bg:#241636;--card:#33204A;--ink:#FFF3E0;--muted:#b9a8d0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
*,*::before,*::after{box-sizing:inherit}
body{background:var(--bg);color:var(--ink);font-family:var(--fb);font-weight:600;font-size:17px;line-height:1.4}
#app{max-width:480px;margin:0 auto;padding:20px;min-height:100%;display:flex;flex-direction:column;position:relative;z-index:1}
.scr{display:flex;flex-direction:column;flex:1}
.in{animation:in .35s ease-out}
@keyframes in{from{opacity:0;transform:translateY(24px) scale(.97)}}
h1,h2{font-family:var(--fd);font-weight:400;margin:0}
h2{font-size:30px;margin:8px 0 14px}
p{margin:0 0 14px;color:var(--muted)}
button,label.btn{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.logo{font-family:var(--fd);font-size:60px;line-height:1;margin:0}
.logo span{display:inline-block;animation:wob 2.4s ease-in-out infinite}
@keyframes wob{50%{transform:translateY(-8px) rotate(-6deg)}}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.gear{width:48px;height:48px;border-radius:50%;border:3px solid var(--ink);background:var(--card);font-size:24px}
.gear:active{transform:rotate(90deg)}
.tile,.btn{display:block;width:100%;border:0;border-radius:22px;box-shadow:0 6px 0 rgba(0,0,0,.25);text-align:left;transition:transform .12s}
.tile{padding:16px 18px;margin:0 0 16px;display:flex;align-items:center;gap:14px}
.tile b{display:block;font-family:var(--fd);font-weight:400;font-size:26px}
.tile span{font-size:15px;font-weight:600}
.ic{flex:none;width:58px;height:58px;border-radius:18px;background:rgba(255,255,255,.3);display:grid;place-items:center;font-size:32px;animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px) rotate(6deg)}}
.btn{padding:16px;margin:12px 0 0;font-family:var(--fd);font-size:24px;text-align:center;background:var(--b);color:#2A1B3D}
.tile:active,.btn:active{transform:translateY(4px) scale(.98);box-shadow:0 2px 0 rgba(0,0,0,.25)}
.ta{background:var(--a);color:#fff}.tb{background:var(--b);color:#2A1B3D}.tc{background:var(--c);color:#12321f}.td{background:var(--d);color:#fff}.te{background:var(--ink);color:var(--bg)}
.back{background:none;border:0;padding:8px 0;color:var(--muted);font-weight:800;text-align:left;align-self:flex-start}
.card{background:var(--card);border-radius:24px;padding:26px 20px;text-align:center;margin:8px 0 6px;box-shadow:0 6px 0 rgba(0,0,0,.15);animation:pop .4s}
.big{font-family:var(--fd);font-size:44px;line-height:1.1;margin:8px 0}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 18px}
.step{width:54px;height:54px;border-radius:50%;border:0;background:var(--ink);color:var(--bg);font-size:28px;font-weight:800}
.num{font-family:var(--fd);font-size:64px;text-align:center;animation:pop .35s}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 14px}
.chip{border:3px solid var(--ink);background:transparent;border-radius:999px;padding:8px 16px;font-weight:800}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.tgl{width:60px;height:34px;border-radius:17px;border:0;background:var(--muted);position:relative;transition:background .2s}
.tgl::after{content:"";position:absolute;top:4px;left:4px;width:26px;height:26px;border-radius:50%;background:#fff;transition:transform .2s}
.tgl[aria-checked="true"]{background:var(--c)}.tgl[aria-checked="true"]::after{transform:translateX(26px)}
input[type=range]{width:55%;accent-color:var(--a)}
.bomb,.boom,.emo{font-size:150px;text-align:center;line-height:1.1;margin:30px 0 10px}
.bomb{animation:pulse .65s ease-in-out infinite}
.boom{animation:pop .45s}.emo{font-size:110px;animation:pop .5s}
@keyframes pulse{50%{transform:scale(1.14)}}
@keyframes pop{0%{transform:scale(.4)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
.swatch{height:130px;border-radius:24px;margin:8px 0 10px;border:3px solid var(--ink);box-shadow:0 6px 0 rgba(0,0,0,.25);animation:pop .4s}
.cam{position:relative;border-radius:24px;overflow:hidden;background:#000;aspect-ratio:3/4;margin:6px 0;border:3px solid var(--ink)}
.cam video{width:100%;height:100%;object-fit:cover}
.ret{position:absolute;left:50%;top:50%;width:22%;aspect-ratio:1;transform:translate(-50%,-50%);border:4px solid #fff;border-radius:14px;box-shadow:0 0 0 2px #000,0 0 0 999px rgba(0,0,0,.25);animation:pulse 1.2s infinite}
.res{display:flex;align-items:center;gap:10px;margin:0 0 10px}
.dot{width:30px;height:30px;border-radius:50%;border:3px solid var(--ink);flex:none}
.bar{flex:1;height:16px;background:var(--card);border-radius:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c);border-radius:8px;animation:grow .8s ease-out}
@keyframes grow{from{width:0!important}}
.sp{flex:1}
.eq{display:flex;align-items:flex-end;justify-content:center;gap:4px;height:60px;margin:10px 0}
.eq i{display:block;width:6px;height:6px;border-radius:3px;background:var(--a);transition:height .05s linear}
.wave{position:relative;height:74px;background:#12121f;border:2px solid var(--ink);border-radius:14px;padding:0 10px;overflow:hidden;margin:10px 0}
.wave-row{position:absolute;inset:0;display:flex;align-items:center;gap:2px;padding:0 10px}
.wave-row.dim i{flex:1;min-width:2px;background:#2c4a63;border-radius:2px}
.wave-row.bright{width:0%}
.wave-row.bright i{flex:none;width:6px;min-width:2px;background:#8fe9ff;border-radius:2px}
.wave-row.live i{flex:none;width:6px;min-width:2px;background:var(--a);border-radius:2px}
.wave-head{position:absolute;top:6px;bottom:6px;width:3px;background:#fff;left:0;box-shadow:0 0 8px #fff;border-radius:2px}
.score{font-family:var(--fd);font-weight:800;font-size:80px;text-align:center;margin:6px 0;animation:pop .4s}
.nin{width:100%;border:3px solid var(--ink);border-radius:14px;background:var(--card);color:var(--ink);font:inherit;font-weight:800;padding:10px 14px;margin:0 0 10px}
.bg{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.bg i{position:absolute;bottom:-50px;font-style:normal;font-size:28px;opacity:.22;animation:fl 14s linear infinite}
@keyframes fl{to{transform:translateY(-120vh) rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

let ac,mg;
let astream,mrec,mchunks,VOICES=[];
function A(){try{if(!ac){ac=new (window.AudioContext||window.webkitAudioContext)();mg=ac.createGain();mg.connect(ac.destination)}mg.gain.value=ST.vol;if(ac.state==='suspended')ac.resume();return ac}catch(e){return null}}
function tone(f,d,t,v,to,at){const c=A();if(!c||!ST.snd)return;to=to||f;at=at||0;const o=c.createOscillator(),g=c.createGain(),t0=c.currentTime+at;o.type=t||'sine';o.frequency.setValueAtTime(f,t0);o.frequency.exponentialRampToValueAtTime(Math.max(1,to),t0+d);g.gain.setValueAtTime(v||.25,t0);g.gain.exponentialRampToValueAtTime(.001,t0+d);o.connect(g);g.connect(mg);o.start(t0);o.stop(t0+d)}
function noise(d,v){const c=A();if(!c||!ST.snd)return;const n=Math.floor(c.sampleRate*d),b=c.createBuffer(1,n,c.sampleRate),a=b.getChannelData(0);for(let i=0;i<n;i++)a[i]=(Math.random()*2-1)*(1-i/n);const s=c.createBufferSource(),g=c.createGain();g.gain.value=v;s.buffer=b;s.connect(g);g.connect(mg);s.start()}
const SFX={
 tap:()=>tone(520,.08,'triangle',.25,780),

 pick:()=>{tone(660,.08,'square',.12);tone(880,.1,'square',.12,880,.07)},
 start:()=>[523,659,784,1047].forEach((f,i)=>tone(f,.14,'square',.15,f,i*.08)),

const hex=h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16));
function lab(c){let[r,g,b]=c.map(v=>{v/=255;return v>.04045?Math.pow((v+.055)/1.055,2.4):v/12.92});const x=(r*.4124+g*.3576+b*.1805)/.95047,y=r*.2126+g*.7152+b*.0722,z=(r*.0193+g*.1192+b*.9505)/1.08883,f=t=>t>.008856?Math.cbrt(t):7.787*t+16/116;return[116*f(y)-16,500*(f(x)-f(y)),200*(f(y)-f(z))]}
function score(a,b){const p=lab(a),q=lab(b);return Math.max(0,Math.round(100-Math.hypot(p[0]-q[0],p[1]-q[1],p[2]-q[2])*1.1))}
function avg(src,w,h){const c=document.createElement('canvas');c.width=c.height=20;const x=c.getContext('2d'),s=Math.min(w,h)*.22;x.drawImage(src,(w-s)/2,(h-s)/2,s,s,0,0,20,20);const d=x.getImageData(0,0,20,20).data,n=d.length/4;let r=0,g=0,b=0;for(let i=0;i<d.length;i+=4){r+=d[i];g+=d[i+1];b+=d[i+2]}return[r/n,g/n,b/n]}

let idb;
function dbOpen(){return new Promise((res,rej)=>{if(idb)return res(idb);const rq=indexedDB.open('picjo',1);rq.onupgradeneeded=()=>rq.result.createObjectStore('voices',{keyPath:'id',autoIncrement:true});rq.onsuccess=()=>{idb=rq.result;res(idb)};rq.onerror=()=>rej(rq.error)})}
function voiceAdd(blob,name){return dbOpen().then(d=>new Promise((res,rej)=>{const tx=d.transaction('voices','readwrite');tx.objectStore('voices').add({name:name||'Suara acak',blob,ts:Date.now()});tx.oncomplete=res;tx.onerror=()=>rej(tx.error)}))}
function voiceDelete(id){return dbOpen().then(d=>new Promise((res,rej)=>{const tx=d.transaction('voices','readwrite');tx.objectStore('voices').delete(id);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)}))}
function voiceListRaw(){return dbOpen().then(d=>new Promise((res,rej)=>{const rq=d.transaction('voices','readonly').objectStore('voices').getAll();rq.onsuccess=()=>res(rq.result);rq.onerror=()=>rej(rq.error)}))}
function refreshVoices(){return voiceListRaw().then(list=>{VOICES=list.map(v=>({...v,url:URL.createObjectURL(v.blob)}))}).catch(()=>{VOICES=[]})}

/* --- rekam & analisis suara --- */
const MAXDUR=6;
function down(d,sr,t){const r=sr/t,n=Math.floor(d.length/r),o=new Float32Array(n);for(let i=0;i<n;i++)o[i]=d[Math.floor(i*r)];return o}
function pitchAC(buf,sr){const n=buf.length,minP=Math.floor(sr/450),maxP=Math.floor(sr/70);let best=-1,bv=0;for(let pr=minP;pr<=maxP;pr++){let sm=0;for(let i=0;i<n-pr;i++)sm+=buf[i]*buf[i+pr];if(sm>bv){bv=sm;best=pr}}return best>0?sr/best:0}
function analyzeBuf(d,sr){const frame=1024,hop=512,pit=[],en=[];let mx=0;for(let i=0;i+frame<=d.length;i+=hop){const sub=d.subarray(i,i+frame);let sm=0;for(let j=0;j<sub.length;j++)sm+=sub[j]*sub[j];const rms=Math.sqrt(sm/sub.length);en.push(rms);if(rms>mx)mx=rms;pit.push(rms>0.006?pitchAC(sub,sr):0)}const th=mx*0.12;const pv=pit.map((f,i)=>en[i]>th&&f>0?f:0);return{pit:pv,en,valid:pv.filter(x=>x>0).length}}
function fillHold(a){let last=0;return a.map(v=>{if(v>0){last=v;return v}return last})}
function rs(a,n){if(!a.length)return new Array(n).fill(0);const o=[];for(let i=0;i<n;i++)o.push(a[Math.round(i*(a.length-1)/(n-1))]);return o}
function zsc(a){const m=a.reduce((x,y)=>x+y,0)/a.length,sd=Math.sqrt(a.reduce((x,y)=>x+(y-m)**2,0)/a.length)||1;return a.map(x=>(x-m)/sd)}
function corr(a,b){const za=zsc(a),zb=zsc(b);let sm=0;for(let i=0;i<za.length;i++)sm+=za[i]*zb[i];return sm/za.length}
function cmpVoice(ref,att){if(ref.valid<4||att.valid<4)return{sc:Math.floor(10+Math.random()*15),low:true};const cp=corr(rs(fillHold(ref.pit),24),rs(fillHold(att.pit),24)),ce=corr(rs(ref.en,24),rs(att.en,24));return{sc:Math.max(5,Math.min(100,Math.round(50+50*(.65*cp+.35*ce)))),low:false}}
function waveOf(en){const w=rs(en,40);const mx=Math.max(...w,.001);return w.map(v=>Math.min(1,v/mx))}
function ensureAnalyzed(v){if(v.valid!==undefined)return Promise.resolve();return v.blob.arrayBuffer().then(buf=>A().decodeAudioData(buf)).then(ab=>{const a=analyzeBuf(down(ab.getChannelData(0),ab.sampleRate,8000),8000);Object.assign(v,a,{wave:waveOf(a.en)})}).catch(()=>Object.assign(v,{pit:[],en:[],valid:0,wave:new Array(40).fill(.2)}))}
function waveBars(arr,cls){return arr.map(h=>`<i style="height:${6+h*58}px"></i>`).join('')+(cls?'':'')}
function waveHTML(dimArr,mode){
 return `<div class="wave"><div class="wave-row dim" id="wdim">${waveBars(dimArr)}</div><div class="wave-row ${mode} " id="wfg" style="width:0%"><div style="display:flex;align-items:center;gap:2px;height:100%;width:${dimArr.length*8}px">${waveBars(dimArr)}</div></div><div class="wave-head" id="whead" style="left:0%"></div></div>`;
}
let vRAF,vSrc,liveWave,liveStart;
function visStart(stream,total){const ctx=A();if(!ctx)return;const an=ctx.createAnalyser();an.fftSize=256;vSrc=ctx.createMediaStreamSource(stream);vSrc.connect(an);const data=new Uint8Array(an.frequencyBinCount);
 liveWave=new Array(40).fill(0);liveStart=performance.now();
 (function loop(){an.getByteFrequencyData(data);let sum=0;for(let i=0;i<data.length;i++)sum+=data[i];const amp=Math.min(1,(sum/data.length/255)*2.2);
  const frac=Math.min(1,(performance.now()-liveStart)/(total*1000)),idx=Math.min(39,Math.floor(frac*40));
  if(amp>liveWave[idx])liveWave[idx]=amp;
  const wfg=document.getElementById('wfg'),head=document.getElementById('whead');
  if(wfg)wfg.style.width=(frac*100)+'%';
  if(head)head.style.left=(frac*100)+'%';
  const bars=wfg?wfg.querySelectorAll('i'):[];for(let i=0;i<=idx&&i<bars.length;i++)bars[i].style.height=(6+liveWave[i]*58)+'px';
  vRAF=requestAnimationFrame(loop)})();
}
function visStop(){if(vRAF)cancelAnimationFrame(vRAF);vRAF=null;if(vSrc){try{vSrc.disconnect()}catch(e){}vSrc=null}}
function liveWaveHTML(dimArr){const lw=liveWave||new Array(40).fill(0);return waveBars(dimArr)+'|'+waveBars(lw)}
function playWave(url,dimArr){if(!url)return;const a=new Audio(url);
 a.onloadedmetadata=()=>{
  const loop=()=>{const frac=a.duration?Math.min(1,a.currentTime/a.duration):0;const wfg=document.getElementById('wfg'),head=document.getElementById('whead');if(wfg)wfg.style.width=(frac*100)+'%';if(head)head.style.left=(frac*100)+'%';if(!a.paused&&!a.ended)requestAnimationFrame(loop)};
  a.onplay=()=>requestAnimationFrame(loop);
  a.onended=()=>{const wfg=document.getElementById('wfg'),head=document.getElementById('whead');if(wfg)wfg.style.width='0%';if(head)head.style.left='0%'};
 };
 a.play().catch(()=>{});
}
function countIn(cb){S.ph='count';S.cd=3;render();vib(40);sfx('tick',1.3);
 bt=setTimeout(function tick(){S.cd--;if(S.cd<=0)cb();else{vib(40);sfx('tick',1.3);render();bt=setTimeout(tick,700)}},700);
}
function recStart(cb,dimArr){navigator.mediaDevices.getUserMedia({audio:true}).then(st=>{astream=st;mchunks=[];let r;try{r=mrec=new MediaRecorder(st)}catch(e){st.getTracks().forEach(t=>t.stop());S.ph='micerr';render();return}
 r.ondataavailable=e=>{if(e.data&&e.data.size)mchunks.push(e.data)};
 r.onstop=()=>{visStop();astream.getTracks().forEach(t=>t.stop());cb(new Blob(mchunks,{type:r.mimeType||'audio/webm'}))};
 r.start();sfx('start');vib(50);S.rt=MAXDUR;render();visStart(st,MAXDUR);
 (function tick(){bt=setTimeout(()=>{S.rt--;if(S.rt<=0)recStop();else{sfx('tick',1);render();tick()}},1000)})();
}).catch(()=>{S.ph='micerr';render()})}
function recStop(){clearTimeout(bt);if(mrec&&mrec.state==='recording')mrec.stop()}
/* --- perpustakaan: UI flow --- */
function startLibRec(){countIn(()=>{S.ph='rec';render();recStart(b=>{S.tmpBlob=b;S.tmpUrl=URL.createObjectURL(b);S.tmpWave=(liveWave||new Array(40).fill(.2)).slice();S.ph='done';render()})})}
function saveLibVoice(){const inp=document.getElementById('vn'),name=(inp&&inp.value.trim())||'';voiceAdd(S.tmpBlob,name).then(refreshVoices).then(()=>{sfx('win');go({screen:'lib'})})}
/* --- Tiru Suara: alur main --- */
function setMN(d){S.mn=Math.max(2,Math.min(8,S.mn+d));sfx('pick');render()}
function mimicNew(){S.pts=[];mimicGo()}
function mimicGo(){if(!VOICES.length)return;S.voice=pickVoice();S.order=[...Array(S.mn).keys()].map(x=>x+1);S.oi=0;S.res=[];go({screen:'mimic',ph:'loading'});ensureAnalyzed(S.voice).then(()=>{S.ph='ready';render()})}
function playRef(){if(S.voice)playWave(S.voice.url,S.voice.wave)}
function goMimicking(){S.res=[];S.oi=0;S.ph='nextready';render()}
function startMimic(){countIn(()=>{S.ph='rec';render();recStart(onRecDone)})}
function tierMsg(sc,low){if(low)return 'Suaranya kurang kedengeran';if(sc>=85)return 'GILA MIRIP BANGET! 🔥';if(sc>=65)return 'Lumayan mirip!';if(sc>=40)return 'Ada mirip-miripnya dikit';return 'Beda jauh euy 😅'}
function onRecDone(blob){
 blob.arrayBuffer().then(buf=>A().decodeAudioData(buf)).then(ab=>{
  const a=analyzeBuf(down(ab.getChannelData(0),ab.sampleRate,8000),8000),r=cmpVoice(S.voice,a);
  S.res.push({p:S.order[S.oi],sc:r.sc,low:r.low});sfx(r.sc>=70?'win':'shutter');vib(60);
  S.lastSc=r.sc;S.lastLow=r.low;S.ph='score';render();setTimeout(()=>sfx(r.sc>=70?'win':'shutter'),150);
 }).catch(()=>{S.res.push({p:S.order[S.oi],sc:15,low:true});S.lastSc=15;S.lastLow=true;S.ph='score';render()});
}
function afterScore(){
 S.oi++;
 if(S.oi>=S.order.length){S.ph='result';const w=[...S.res].sort((x,y)=>y.sc-x.sc)[0].p;S.pts[w-1]=(S.pts[w-1]||0)+1;sfx('win')}
 else S.ph='nextready';
 render();
}
